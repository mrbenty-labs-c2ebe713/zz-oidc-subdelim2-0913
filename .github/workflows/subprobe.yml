name: subprobe
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: "a:b"
    steps:
      - name: mint id-token and print ONLY claim fields
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=zzprobe0913" -o /tmp/t.json
          python3 -c "import json,base64;t=json.load(open('/tmp/t.json'))['value'];p=t.split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print('=== SELECTED CLAIMS (token never printed) ===');[print('%-26s %r'%(k,c.get(k,'<ABSENT>'))) for k in ['sub','environment','repository','repo_property_env']];print('=== ALL KEYS ===');print(sorted(c.keys()))"
